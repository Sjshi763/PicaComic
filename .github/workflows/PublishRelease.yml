name: publish release assets

on:
  workflow_run:
    workflows: ["release"]
    types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  publish_release:
    name: Publish release assets
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'release'
    steps:
      - name: Download build artifacts from release workflow
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dist
      - name: Read release metadata
        id: meta
        run: |
          source dist/pica-comic-release-meta/release_meta.env
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
      - name: List all files
        run: find dist -type f -name "PicaComic-*"
      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          files: |
            dist/pica-comic-android/PicaComic-*.apk
            dist/pica-comic-windows/PicaComic-*.zip
            dist/pica-comic-windows/PicaComic-*.msi
            dist/pica-comic-apple/PicaComic-*.ipa
            dist/pica-comic-apple/PicaComic-*.zip
            dist/pica-comic-linux/PicaComic-*.deb
            dist/pica-comic-linux/PicaComic-*.pkg.tar.zst
          fail_on_unmatched_files: true
