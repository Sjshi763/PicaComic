name: Release Multi Platform

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Build Android APK
        run: flutter build apk --release
      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: pica-comic-android
          path: build/app/outputs/flutter-apk/app-release.apk

  build_windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Build Windows release
        run: flutter build windows --release
      - name: Pack Windows artifact
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath pica-comic-windows.zip
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: pica-comic-windows
          path: pica-comic-windows.zip

  build_apple:
    name: Build Apple (iOS + macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode_16.4.app
      - name: Install dependencies
        run: flutter pub get
      - name: Build iOS release (unsigned)
        run: flutter build ios --release --no-codesign
      - name: Build macOS release
        run: flutter build macos --release
      - name: Package iOS IPA
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          mv Runner.app Payload/
          zip -r pica-comic-ios.ipa Payload
      - name: Package macOS app
        run: |
          cd build/macos/Build/Products/Release
          ditto -c -k --sequesterRsrc --keepParent pica_comic.app pica-comic-macos.zip
      - name: Upload Apple artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pica-comic-apple
          path: |
            build/ios/iphoneos/pica-comic-ios.ipa
            build/macos/Build/Products/Release/pica-comic-macos.zip

  publish_release:
    name: Publish release assets
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    needs:
      - build_android
      - build_windows
      - build_apple
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/pica-comic-android/app-release.apk
            dist/pica-comic-windows/pica-comic-windows.zip
            dist/pica-comic-apple/pica-comic-ios.ipa
            dist/pica-comic-apple/pica-comic-macos.zip
